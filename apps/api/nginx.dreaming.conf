# Dreaming AI API — dreaming.suksomsri.cloud (HTTP เท่านั้นจนกว่า DNS จะชี้มา แล้วรัน certbot)
limit_req_zone $binary_remote_addr zone=lucid_api:10m rate=60r/m;
server {
    server_name dreaming.suksomsri.cloud;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / {
        limit_req zone=lucid_api burst=20 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dreaming.suksomsri.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dreaming.suksomsri.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = dreaming.suksomsri.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name dreaming.suksomsri.cloud;
    return 404; # managed by Certbot


}